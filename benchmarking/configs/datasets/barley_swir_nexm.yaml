schema_version: 1
id: barley_swir_nexm
display_name: Barley SWIR rendered images with NExM auxiliary channel
root: data/raw/barley_swir
images:
  directory: images
  extensions: [.png]
  dimensions: {height: 512, width: 512}
  source_channels: 3
  model_channels: 4
  colour_mode: rendered_rgb
  alpha_handling: absent
masks:
  directory: masks
  extensions: [.png]
  dimensions: {height: 512, width: 512}
  format: binary_grayscale
  classes: [background, plant]
  foreground_values: [255]
  threshold: 127
pairing:
  strategy: identical_stem
preprocessing:
  normalization: zero_one
  resize: {height: 512, width: 512}
  interpolation: bilinear
  mask_interpolation: nearest
  auxiliary_channels:
    - name: normalized_excess_magenta
      transform: nexm
      enabled: true
      parameters:
        epsilon: 1.0e-6
        signed_to_zero_one: true
augmentation:
  enabled: true
  execution: runtime
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  rotations_degrees: [0, 90, 180, 270]
  brightness_delta: 0.0
splits:
  folds: 5
  validation_fraction: 0.1
  seed: 42
  shuffle: true
  stratify: false
  group_by_source: true
  source_group_regex: 'PS_Tray_(\d+)'
notes:
  - NExM is derived from the rendered false-colour channels; it is not a physical spectral index.
  - Use barley_swir.yaml for the three-channel ablation.
