schema_version: 1
id: wheat
display_name: Wheat RGB with alpha source
root: data/raw/wheat
images:
  directory: images
  extensions: [.png]
  dimensions: {height: 512, width: 512}
  source_channels: 4
  model_channels: 3
  colour_mode: rgba
  alpha_handling: drop
masks:
  directory: masks_binary
  extensions: [.png]
  dimensions: {height: 512, width: 512}
  format: binary_grayscale
  classes: [background, plant]
  foreground_values: [255]
  threshold: 127
pairing:
  strategy: identical_stem
preprocessing:
  normalization: zero_one
  resize: {height: 512, width: 512}
  interpolation: bilinear
  mask_interpolation: nearest
  auxiliary_channels:
    - name: excess_green
      transform: exg
      enabled: false
augmentation:
  enabled: true
  execution: runtime
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  rotations_degrees: [0, 90, 180, 270]
  brightness_delta: 0.0
  parameters:
    historical_offline_augment_factor: 8
splits:
  folds: 5
  validation_fraction: 0.1
  seed: 42
  shuffle: true
  stratify: false
  group_by_source: true
notes:
  - Masks Binary is the binary ground-truth directory used by the benchmark.
  - masks_source_multilevel contains the retained multi-level masks pending provenance confirmation.
  - The alpha channel is explicitly dropped before three-channel methods receive the image.
