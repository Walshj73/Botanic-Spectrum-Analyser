schema_version: 1
id: barley_swir
display_name: Barley SWIR rendered images
root: data/raw/barley_swir
images:
  directory: images
  extensions: [.png]
  dimensions: {height: 512, width: 512}
  source_channels: 3
  model_channels: 3
  colour_mode: rendered_rgb
  alpha_handling: absent
masks:
  directory: masks
  extensions: [.png]
  dimensions: {height: 512, width: 512}
  format: binary_grayscale
  classes: [background, plant]
  foreground_values: [255]
  threshold: 127
pairing:
  strategy: identical_stem
preprocessing:
  normalization: zero_one
  resize: {height: 512, width: 512}
  interpolation: bilinear
  mask_interpolation: nearest
  auxiliary_channels:
    - name: excess_green_on_rendered_channels
      transform: exg
      enabled: false
augmentation:
  enabled: true
  execution: runtime
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  rotations_degrees: [0, 90, 180, 270]
  brightness_delta: 0.0
  parameters:
    historical_offline_augment_factor: 8
splits:
  folds: 5
  validation_fraction: 0.1
  seed: 42
  shuffle: true
  stratify: false
  group_by_source: true
  source_group_regex: 'PS_Tray_(\d+)'
notes:
  - The stored inputs are rendered three-channel SWIR images, not raw spectral cubes.
  - Raw data was moved without duplication from the verified legacy tree.
  - Repeated observations with the same PS_Tray identifier remain in one split.
