schema_version: 1
id: slic_rf_v1
display_name: SLIC superpixels with Random Forest
family: classical
implementation: bsa_benchmark.methods.slic_rf:SuperpixelRandomForestSegmentation
implementation_version: new-baseline-v1
accepted_input_channels: [3]
hyperparameters:
  slic:
    n_segments: 1000
    compactness: 10.0
    sigma: 1.0
    start_label: 0
  features:
    colour_statistics: [mean, std]
    include_geometry: true
    texture_features: []
  classifier:
    n_estimators: 200
    max_depth: null
    class_weight: balanced
    n_jobs: -1
training:
  superpixel_label_rule: majority
notes:
  - This is a new baseline; the original historical SLIC-RF source is missing.
  - Results from this implementation must never be labelled as reproducing historical SLIC-RF.
